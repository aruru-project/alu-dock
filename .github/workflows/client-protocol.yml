name: Client protocol compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: client-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Actual Host and official Rust client
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0

      - name: Restore Cargo packages and dependency builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: client-protocol
          workspaces: clients/official -> target
          cache-on-failure: false

      - name: Install root dependencies
        run: npm ci

      - name: Verify additive Protocol V2 decoding policy
        run: cargo test --locked --manifest-path clients/official/Cargo.toml -p aludock-client-core additive_host_metadata

      - name: Verify actual Host and official Rust client
        run: npm run test:client-protocol
