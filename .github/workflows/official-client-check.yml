name: Official client checks

on:
  pull_request:
    paths:
      - "clients/official/**"
      - ".github/actions/setup-toolchain/**"
      - ".github/workflows/official-client-check.yml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: official-client-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend, Rust core and Linux Tauri checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same native development libraries as release.yml; no packaging tools.
      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up the build toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: "24.22.1"
          pnpm-version: "10.17.1"
          rust-version: "1.88.0"

      - name: Restore Cargo packages and dependency builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: official-client-check-linux
          workspaces: |
            clients/official -> target
            clients/official/src-tauri -> target
          cache-on-failure: false

      # The composite action installs the locked frontend dependencies. This
      # root script only dispatches client checks; it needs no root npm install.
      - name: Check the complete official client
        run: npm run client:check
