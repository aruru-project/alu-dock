name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_NDK_VERSION: "29.0.14206865"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive the release from its tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-list -n 1 "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux ZIP
    needs: prepare
    env:
      ALUDOCK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: clients/official

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zip

      - name: Set up the build toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Restore Cargo packages and dependency builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-linux
          workspaces: |
            clients/official -> target
            clients/official/src-tauri -> target
          cache-on-failure: false

      - name: Run release checks
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --workspace --locked
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          pnpm test

      - name: Build the Linux executable
        run: pnpm tauri build --no-bundle --ci --config '{"version":"${{ needs.prepare.outputs.version }}"}'

      - name: Package the Linux executable
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mkdir -p release/linux
          install -m 0755 src-tauri/target/release/aludock-client-app release/linux/AluDock
          (
            cd release/linux
            zip -9 "../AluDock-${VERSION}-linux-x86_64.zip" AluDock
          )

      - name: Upload the Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ needs.prepare.outputs.tag }}
          path: clients/official/release/AluDock-*-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Build Windows package
    needs: prepare
    env:
      ALUDOCK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: clients/official

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up the build toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install Dock dependencies
        working-directory: .
        run: npm ci

      - name: Enter the Visual Studio developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Restore Cargo packages and dependency builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-windows
          workspaces: |
            clients/official -> target
            clients/official/src-tauri -> target
          cache-on-failure: false

      - name: Assemble the Windows package
        run: pnpm run package:windows

      - name: Upload the Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ needs.prepare.outputs.tag }}
          path: clients/official/dist/AluDock-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 3

  android:
    name: Build signed Android APK
    needs: prepare
    env:
      ALUDOCK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: AndroidBuild
    defaults:
      run:
        working-directory: clients/official

    steps:
      - name: Check Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        working-directory: .
        run: |
          missing=0
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing AndroidBuild secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "::error::Android sdkmanager was not found at $sdkmanager"
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "platform-tools" \
            "platforms;android-$ANDROID_API_LEVEL" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "NDK_HOME=$sdk_root/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up the build toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          rust-target: aarch64-linux-android

      - name: Restore Cargo packages and dependency builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-android-arm64
          workspaces: |
            clients/official -> target
            clients/official/src-tauri -> target
          cache-on-failure: false

      - name: Prepare the Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aludock-release.p12"
          chmod 0600 "$RUNNER_TEMP/aludock-release.p12"

      - name: Build the signed ARM64 APK
        env:
          ALUDOCK_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aludock-release.p12
          ALUDOCK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALUDOCK_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALUDOCK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm tauri android build --apk --target aarch64 --ci --config '{"version":"${{ needs.prepare.outputs.version }}"}'

      - name: Verify and stage the APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mapfile -t apks < <(
            find src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*release*.apk' ! -name '*unsigned*'
          )
          if [[ "${#apks[@]}" -ne 1 ]]; then
            printf 'Expected one signed release APK, found %s\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          destination="AluDock-${VERSION}-android-arm64.apk"
          cp "${apks[0]}" "$destination"
          "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" verify --verbose "$destination"
          mapfile -t libraries < <(unzip -Z1 "$destination" | grep '^lib/')
          if [[ "${#libraries[@]}" -ne 1 || "${libraries[0]}" != 'lib/arm64-v8a/libaludock_client_app_lib.so' ]]; then
            printf 'Unexpected native libraries:\n%s\n' "${libraries[*]}" >&2
            exit 1
          fi

      - name: Upload the Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-${{ needs.prepare.outputs.tag }}
          path: clients/official/AluDock-*-android-arm64.apk
          if-no-files-found: error
          retention-days: 3

      - name: Remove the Android signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/aludock-release.p12"

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - linux
      - windows
      - android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum AluDock-* > SHA256SUMS.txt

      - name: Create or repair the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --generate-notes \
              --title "AluDock $VERSION" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
