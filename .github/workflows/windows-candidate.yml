name: Windows candidate (no publication)

on:
  push:
    branches: [feat/card-270-windows-install-experience]
  workflow_dispatch:
    inputs:
      version:
        description: Internal candidate version for an actual in-place upgrade baseline (no publication)
        required: true
        default: '2.9.0'
        type: string

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ALUDOCK_RELEASE_VERSION: ${{ inputs.version || '2.9.0' }}
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Keep the temporary runner on the configured Rust toolchain
        # rust-cache fingerprints every installed toolchain; hosted images vary
        # in their unused stable version. This changes only this disposable job.
        run: rustup toolchain uninstall stable
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-candidate
          workspaces: |
            clients/official -> target
            clients/official/src-tauri -> target
          # Keep successful compilation when a later packaging step fails.
          cache-on-failure: true
      - name: Install Dock dependencies
        run: npm ci
      - name: Check private installer transactions in an isolated tree
        shell: powershell
        run: ./test/windows-package-startup.test.ps1 -Installer ./clients/official/scripts/windows-package.ps1
      - name: Build Setup and reusable components
        run: npm run package:windows
      - name: Record exact candidate and package checksums
        shell: pwsh
        run: |
          $directory = 'clients/official/dist'
          "source-sha=${{ github.sha }}" | Set-Content "$directory/candidate.txt"
          Get-ChildItem "$directory/AluDock-*-windows-x86_64*" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content "$directory/candidate.txt"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-candidate-${{ github.sha }}
          path: |
            clients/official/dist/AluDock-*-windows-x86_64-Setup.exe
            clients/official/dist/AluDock-*-windows-x86_64-components.zip
            clients/official/dist/candidate.txt
          if-no-files-found: error
          retention-days: 7
      - name: Install the actual Setup in the disposable Windows profile
        shell: powershell
        run: |
          ./test/windows-setup-smoke.test.ps1 `
            -Installer "clients/official/dist/AluDock-$env:ALUDOCK_RELEASE_VERSION-windows-x86_64-Setup.exe" `
            -ExpectedVersion $env:ALUDOCK_RELEASE_VERSION
