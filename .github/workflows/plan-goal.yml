name: Plan and Goal integration

on:
  pull_request:
    paths:
      - "src/pi/**"
      - "src/control/**"
      - "src/core/**"
      - "src/worker/**"
      - "test/pi-*.test.ts"
      - "test/fixtures/**"
      - "test/support/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/plan-goal.yml"

permissions:
  contents: read

concurrency:
  group: plan-goal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Real Pi with a loopback model
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check and test in an isolated user environment
        shell: bash
        run: |
          root="$(mktemp -d /tmp/alu-pg-ci.XXXXXX)"
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/home" "$root/tmp"
          # No inherited credentials or personal Pi state. Model requests in
          # these real-Worker suites use only deterministic loopback fixtures.
          env -i PATH="$PATH" LANG=C.UTF-8 \
            HOME="$root/home" USERPROFILE="$root/home" \
            XDG_CONFIG_HOME="$root/config" XDG_CACHE_HOME="$root/cache" \
            XDG_STATE_HOME="$root/state" XDG_DATA_HOME="$root/data" XDG_RUNTIME_DIR="$root/run" \
            APPDATA="$root/appdata" LOCALAPPDATA="$root/localappdata" \
            PI_CODING_AGENT_DIR="$root/pi" PI_OFFLINE=1 \
            TMPDIR="$root/tmp" TEMP="$root/tmp" TMP="$root/tmp" \
            npm_config_cache="$root/npm" \
            NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost \
            bash --noprofile --norc -euo pipefail <<'CHECKS'
          npm ci --no-audit --no-fund
          npm run check -- --pretty false
          # The extension autoloads in every Pi Work, so validate the full Node
          # suite once at the final feature commit, including SDK and PTY gates.
          npm test
          CHECKS
