name: Diagnose Android keystore secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Report keystore secret shape (no contents)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: AndroidBuild
    steps:
      - name: Report shape only
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          value="$ANDROID_KEYSTORE_BASE64"
          echo "length: ${#value}"
          stripped="$(printf '%s' "$value" | tr -d ' \t\r\n')"
          echo "length_without_whitespace: ${#stripped}"
          echo "length_mod_4: $(( ${#stripped} % 4 ))"
          if printf '%s' "$stripped" | grep -qE '^[A-Za-z0-9+/]*={0,2}$'; then
            echo "charset: standard base64"
          elif printf '%s' "$stripped" | grep -qE '^[A-Za-z0-9_-]*={0,2}$'; then
            echo "charset: url-safe base64"
          else
            echo "charset: contains characters outside both base64 alphabets"
            printf '%s' "$stripped" | tr -d 'A-Za-z0-9+/=_-' | fold -w1 | sort -u | wc -l | xargs echo "distinct_foreign_characters:"
          fi
          if printf '%s' "$stripped" | base64 --decode > /dev/null 2>&1; then
            echo "standard_decode: ok"
          else
            echo "standard_decode: failed"
          fi
