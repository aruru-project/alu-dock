name: Set up AluDock build toolchain
description: Install the locked Node.js, pnpm, and Rust toolchains and official client dependencies.

inputs:
  node-version:
    description: Node.js version
    default: "24"
  pnpm-version:
    description: pnpm version
    default: "10.17.1"
  rust-version:
    description: Rust version
    default: "1.88.0"
  rust-target:
    description: Optional additional Rust target
    default: ""

runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Activate pnpm
      env:
        PNPM_VERSION: ${{ inputs.pnpm-version }}
      shell: bash
      run: |
        corepack enable
        corepack prepare "pnpm@$PNPM_VERSION" --activate

    - name: Locate the pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore the pnpm package cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('clients/official/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-

    - name: Install Rust
      env:
        RUST_VERSION: ${{ inputs.rust-version }}
        RUST_TARGET: ${{ inputs.rust-target }}
      shell: bash
      run: |
        rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
        rustup override set "$RUST_VERSION"
        if [[ -n "$RUST_TARGET" ]]; then
          rustup target add "$RUST_TARGET"
        fi

    - name: Install frontend dependencies
      shell: bash
      working-directory: clients/official
      run: pnpm install --frozen-lockfile
