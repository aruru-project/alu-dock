[package]
name = "aludock-client-app"
version = "0.2.6"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[lib]
name = "aludock_client_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aludock-client-core = { path = "../crates/aludock-client-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1.49", features = ["sync", "time", "net", "io-util"] }
uuid = { version = "1.22", features = ["v4"] }
mime_guess = "2.0"
hostname = "0.4"

[target.'cfg(windows)'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.4.3"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
