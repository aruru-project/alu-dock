[package]
name = "aludock-client-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[lib]
name = "aludock_client_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aludock-client-core = { path = "../crates/aludock-client-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tokio = { version = "1.49", features = ["sync"] }
uuid = { version = "1.22", features = ["v4"] }
mime_guess = "2.0"
