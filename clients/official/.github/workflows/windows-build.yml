name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Activate the locked pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test reusable Rust core
        run: cargo test --workspace

      - name: Test Tauri host
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test frontend behavior
        run: pnpm test

      - name: Build unsigned Windows installers
        run: pnpm tauri build --bundles nsis,msi

      - name: Upload unsigned installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aludock-windows-unsigned-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 14
