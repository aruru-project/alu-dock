name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate the locked pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test reusable Rust core
        run: cargo test --workspace

      - name: Test Tauri host
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test frontend behavior
        run: pnpm test

      - name: Build unsigned Windows installers
        run: pnpm tauri build --bundles nsis,msi

      - name: Upload unsigned installers
        uses: actions/upload-artifact@v4
        with:
          name: aludock-windows-unsigned-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 14
