name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Activate the locked pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Locate the pnpm store
        id: pnpm-store
        shell: pwsh
        run: '"path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT'

      - name: Restore the pnpm package cache
        id: pnpm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: windows-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: windows-pnpm-

      - name: Locate the Tauri tool cache
        id: tauri-tools
        shell: pwsh
        run: '"path=$env:LOCALAPPDATA\tauri" >> $env:GITHUB_OUTPUT'

      - name: Restore Tauri packaging tools
        id: tauri-tools-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.tauri-tools.outputs.path }}
          key: windows-tauri-tools-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: windows-tauri-tools-

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Restore Cargo packages and dependency builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-desktop
          workspaces: |
            . -> target
            src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Save the pnpm package cache
        if: always() && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: windows-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Test reusable Rust core
        run: cargo test --workspace --locked

      - name: Test Tauri host
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Test frontend behavior
        run: pnpm test

      - name: Build the unsigned Windows executable
        run: pnpm tauri build --no-bundle --ci

      - name: Package unsigned Windows installers
        run: pnpm tauri bundle --bundles 'nsis,msi' --no-sign --ci

      - name: Save Tauri packaging tools
        if: always() && steps.tauri-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.tauri-tools.outputs.path }}
          key: windows-tauri-tools-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Upload unsigned installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aludock-windows-unsigned-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 14
